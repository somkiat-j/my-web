<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomePage</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Somkiat</a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
          aria-controls="navbarDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDrawer"
          aria-labelledby="navbarDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact</a>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  type="button"
                  data-bs-toggle="menu"
                  aria-expanded="false"
                >
                  Category
                </button>
                <div class="menu">
                  <a class="menu-item" href="#">อิเล็กทรอนิกส์</a>
                  <a class="menu-item" href="#">เทคโนโลยีสารสนเทศ</a>
                  <a class="menu-item" href="#">การตลาด</a>
                  <a class="menu-item" href="#">ช่างยนต์</a>
                  <hr class="menu-divider" />
                  <a class="menu-item" href="#">เพิ่มประเภท</a>
                </div>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Profile</a>
              </li>
            </ul>
            <form class="hstack gap-2" role="search">
              <input
                class="form-control"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <svg class="bi" width="16" height="16">
                  <use href="#search" />
                </svg>
              </button>
            </form>
          </div>
        </dialog>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <div class="md:col-8">
          <a href="about.html">เกี่ยวกับเรา</a>
          <h1 style="color: blue">Welcome to web site</h1>
          <h2>ออกแบบโดย สมเกียรติ ใจดี</h2>
          <br />
        </div>
        <div class="md:col-4">
          <img src="/images/somkiat.jpg" class="img" />
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
